name: DeltaSens
options:
  bundleIdPrefix: com.delta
targets:
  DeltaSens:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [DeltaSens]
    info:
      path: DeltaSens/Info.plist
      properties:
        CFBundleDisplayName: 灵敏度助手
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMotionUsageDescription: 需要访问陀螺仪以进行灵敏度测试
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
