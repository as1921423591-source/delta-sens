name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen
        
      - name: List files
        run: ls -la

      - name: Build
        run: |
          PROJECT=$(ls -d *.xcodeproj | head -1)
          xcodebuild \
            -project "$PROJECT" \
            -scheme DeltaSens \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DeltaSens.app Payload/
          zip -r DeltaSens.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeltaSens-ipa
          path: DeltaSens.ipa
